name: Feature Building

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - '**/*.rst'
      - 'LICENSE'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - '**/*.rst'
      - 'LICENSE'

jobs:
  build:

    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build
        run: |
          brew install automake
          brew install autoconf
          brew install libtool
          make VERSION="2026.9.2" BUILD_NUMBER="${GITHUB_RUN_NUMBER}" debug
          make debug-dmg
          shasum -a 256 build/Debug/ShadowsocksX-NG.dmg > build/Debug/ShadowsocksX-NG.dmg.checksum

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShadowsocksX-NG
          path: |
            build/Debug/ShadowsocksX-NG.dmg
            build/Debug/ShadowsocksX-NG.dmg.checksum

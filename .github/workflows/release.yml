name: Release Building

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:

    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build
        run: |
          brew install automake
          brew install autoconf
          brew install libtool
          make VERSION="${GITHUB_REF_NAME}" BUILD_NUMBER="${GITHUB_RUN_NUMBER}" release
          make release-dmg
          cd build/Release
          package_name="ShadowsocksX-NG.${GITHUB_REF_NAME}"
          mv ShadowsocksX-NG.dmg "${package_name}.dmg"
          shasum -a 256 "${package_name}.dmg" > "${package_name}.dmg.checksum"
          zip "${package_name}.zip" "${package_name}.dmg" "${package_name}.dmg.checksum"
          shasum -a 256 "${package_name}.zip" > "${package_name}.zip.checksum"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShadowsocksX-NG.${{ github.ref_name }}
          path: |
            build/Release/ShadowsocksX-NG.${{ github.ref_name }}.dmg
            build/Release/ShadowsocksX-NG.${{ github.ref_name }}.dmg.checksum

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ShadowsocksX-NG Fork ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/Release/ShadowsocksX-NG.${{ github.ref_name }}.dmg
            build/Release/ShadowsocksX-NG.${{ github.ref_name }}.dmg.checksum
            build/Release/ShadowsocksX-NG.${{ github.ref_name }}.zip
            build/Release/ShadowsocksX-NG.${{ github.ref_name }}.zip.checksum
